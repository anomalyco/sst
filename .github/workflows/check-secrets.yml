name: check-secrets

# Temporary: exercises the same AWS steps as release.yml / build.yml / binary.yml.
# Deleted right after it runs.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/sst-release
          role-session-name: sst-check-${{ github.run_id }}
          aws-region: us-east-1
      - name: Fetch the release secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            DISCORD_WEBHOOK_URL,sst/release/DISCORD_WEBHOOK_URL
            NPM_TOKEN,sst/release/NPM_TOKEN
          parse-json-secrets: false
      - name: Check
        env:
          DISCORD_WEBHOOK_URL: ${{ env.DISCORD_WEBHOOK_URL }}
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK_URL" && echo DISCORD_WEBHOOK_URL ok
          test -n "$NPM_TOKEN" && echo NPM_TOKEN ok
