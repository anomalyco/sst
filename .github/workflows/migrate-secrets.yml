name: migrate-secrets

# Temporary: copies the remaining sst repo secrets into Secrets Manager.
# Deleted right after it runs.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/sst-release
          role-session-name: sst-migrate-${{ github.run_id }}
          aws-region: us-east-1
      - name: Copy DISCORD_WEBHOOK_URL
        env:
          V: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$V"
          aws secretsmanager put-secret-value --secret-id sst/release/DISCORD_WEBHOOK_URL --secret-string "$V" > /dev/null
      - name: Copy NPM_TOKEN
        env:
          V: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$V"
          aws secretsmanager put-secret-value --secret-id sst/release/NPM_TOKEN --secret-string "$V" > /dev/null
